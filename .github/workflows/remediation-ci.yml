name: Remediation Fortress CI

on:
  push:
    branches: [main, "remediation/*", "feature/*"]
  pull_request:
    branches: [main, "feature/*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Python Lint
        run: |
          ruff check api/ scripts/core/

  contracts-ts:
    name: contracts-ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Remotion App Dependencies
        working-directory: ./remotion-app
        run: npm ci

      - name: TypeScript Compile & Lint
        working-directory: ./remotion-app
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Vitest Suite
        run: npm run test

  ground-truth:
    name: ground-truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Ground Truth Sync
        run: |
          python scripts/validators/check_ground_truth_sync.py --check

      - name: Check Dependency Lock
        run: |
          python scripts/validators/check_dependencies_lock.py --check

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Pytest with Coverage Threshold
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          pytest --cov=api --cov=scripts/core --cov-report=xml --cov-report=term --cov-fail-under=48 \
            tests/core tests/gates tests/generators tests/validators tests/architecture tests/contracts tests/fault_injection tests/security tests/api tests/integration/test_pr003_ai_runtime_vertical_slice.py tests/integration/test_pr004_state_consistency.py tests/integration/test_pr005_process_hard_death_recovery.py tests/integration/test_pr005_run_blueprint_provenance.py tests/e2e/test_pipeline_integration.py

      - name: Upload Python Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  strict-e2e:
    name: strict-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci
          npx remotion browser ensure

      - name: Run True E2E Matrix Suite
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          python tests/e2e/true_e2e_suite.py

      - name: Upload E2E Test Artifacts (QC Reports and Logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-e2e-artifacts
          path: |
            projects/**/final_qc_report.json
            projects/**/run.log
            projects/**/05_blueprint.json
          retention-days: 7

  docker-render:
    name: docker-render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermetic Docker Image
        run: |
          BUILD_LOG=$(mktemp)
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Docker build attempt $attempt/$MAX_ATTEMPTS..."
            if docker build -t clean-video-builder -f .agents/docker/Dockerfile.remotion . 2>&1 | tee "$BUILD_LOG"; then
              echo "Docker build succeeded."
              rm -f "$BUILD_LOG"
              break
            fi
            if grep -Ei "toomanyrequests|429 too many requests|rate limit|connection reset|i/o timeout|handshake timeout|temporary failure in name resolution" "$BUILD_LOG" >/dev/null 2>&1; then
              if [ $attempt -eq $MAX_ATTEMPTS ]; then
                echo "Docker build failed after $MAX_ATTEMPTS transient registry/network attempts."
                rm -f "$BUILD_LOG"
                exit 1
              fi
              sleep_sec=$((attempt * 15))
              echo "Transient Docker registry rate limit or network error detected. Waiting ${sleep_sec}s before retry (attempt $attempt/$MAX_ATTEMPTS)..."
              sleep $sleep_sec
            else
              echo "Deterministic Docker build failure detected (not a registry rate limit). Failing immediately without retry."
              rm -f "$BUILD_LOG"
              exit 1
            fi
          done

      - name: Verify Container Execution
        run: |
          docker run --rm clean-video-builder npx remotion versions

      - name: Test Docker Container Subcommand Validation
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          pytest tests/remediation/s02_acceptance/test_acc_007_docker_subcommand_validation.py -v

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Python Dependency Audit (pip-audit)
        run: |
          pip-audit --desc -r requirements.txt

      - name: Run Node Dependency Audit (Root & App)
        run: |
          npm audit --audit-level=high
          cd remotion-app && npm audit --audit-level=high

      - name: Run Bandit Static Security Scan
        run: |
          bandit -r api/ scripts/core/ -lll

      - name: Run Static Secret Scanner
        run: |
          python scripts/validators/check_secrets.py

      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'

  remotion-verification:
    name: remotion-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci

      - name: Ensure Remotion Browser
        run: |
          npx remotion browser ensure

      - name: Tier 1 — Fast Remotion Verification
        run: |
          mkdir -p /tmp/vitest_pr_a1_reports
          python3 - << 'EOF'
          import glob, os, subprocess, sys
          tier2_names = {
              's28_r09_remotion_adapter.test.ts',
              's28_r10_canvas_adapter.test.ts',
              's28_r11_master_compositor.test.ts',
              's28_r12_render_planner.test.ts',
              's28_r14_production_integration.test.ts',
              's28_r15_destruction_and_load.test.ts',
              's28_r15_part3_final_campaigns.test.ts'
          }
          all_files = sorted(glob.glob('tests/remotion/*.test.ts'))
          t1_files = [f for f in all_files if os.path.basename(f) not in tier2_names]
          print(f"Executing Tier 1 fast verification with {len(t1_files)} files...")
          cmd = [
              'npx', 'vitest', 'run',
              *t1_files,
              '--reporter=default',
              '--reporter=json',
              '--outputFile=/tmp/vitest_pr_a1_reports/tier1_report.json'
          ]
          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          EOF

      - name: Tier 2 — Heavy Remotion Integration Verification
        if: success() || failure()
        run: |
          mkdir -p /tmp/vitest_pr_a1_reports
          python3 - << 'EOF'
          import os, shutil, subprocess, sys

          tier2_files = [
              'tests/remotion/s28_r09_remotion_adapter.test.ts',
              'tests/remotion/s28_r10_canvas_adapter.test.ts',
              'tests/remotion/s28_r11_master_compositor.test.ts',
              'tests/remotion/s28_r12_render_planner.test.ts',
              'tests/remotion/s28_r14_production_integration.test.ts',
              'tests/remotion/s28_r15_destruction_and_load.test.ts',
              'tests/remotion/s28_r15_part3_final_campaigns.test.ts'
          ]

          print(f"Executing Tier 2 heavy integration verification with {len(tier2_files)} files sequentially...")
          cmd = [
              'npx', 'vitest', 'run',
              *tier2_files,
              '--no-file-parallelism',
              '--maxConcurrency=1',
              '--reporter=default',
              '--reporter=json',
              '--outputFile=/tmp/vitest_pr_a1_reports/tier2_report.json'
          ]
          if shutil.which('xvfb-run'):
              cmd = ['xvfb-run', '--auto-servernum'] + cmd

          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          EOF

      - name: Mandatory Remotion Test Accounting & Reconciliation
        if: success() || failure()
        run: |
          python3 - << 'EOF'
          import glob, json, os, subprocess, sys

          tier2_basenames = {
              's28_r09_remotion_adapter.test.ts',
              's28_r10_canvas_adapter.test.ts',
              's28_r11_master_compositor.test.ts',
              's28_r12_render_planner.test.ts',
              's28_r14_production_integration.test.ts',
              's28_r15_destruction_and_load.test.ts',
              's28_r15_part3_final_campaigns.test.ts'
          }

          discovered_files = sorted(glob.glob('tests/remotion/*.test.ts'))
          discovered_norm = set(os.path.realpath(f) for f in discovered_files)

          report1_path = '/tmp/vitest_pr_a1_reports/tier1_report.json'
          report2_path = '/tmp/vitest_pr_a1_reports/tier2_report.json'

          if not os.path.exists(report1_path) or not os.path.exists(report2_path):
              print(f"ERROR: Vitest report files missing: tier1={os.path.exists(report1_path)}, tier2={os.path.exists(report2_path)}")
              sys.exit(1)

          with open(report1_path) as f:
              t1 = json.load(f)
          with open(report2_path) as f:
              t2 = json.load(f)

          t1_files = set(os.path.realpath(r['name']) for r in t1.get('testResults', []))
          t2_files = set(os.path.realpath(r['name']) for r in t2.get('testResults', []))

          overlap = t1_files & t2_files
          union_files = t1_files | t2_files
          missing_files = discovered_norm - union_files
          extra_files = union_files - discovered_norm

          t1_passed = t1.get('numPassedTests', 0)
          t1_failed = t1.get('numFailedTests', 0)
          t1_pending = t1.get('numPendingTests', 0)
          t1_total = t1.get('numTotalTests', 0)

          t2_passed = t2.get('numPassedTests', 0)
          t2_failed = t2.get('numFailedTests', 0)
          t2_pending = t2.get('numPendingTests', 0)
          t2_total = t2.get('numTotalTests', 0)

          total_passed = t1_passed + t2_passed
          total_failed = t1_failed + t2_failed
          total_pending = t1_pending + t2_pending
          total_tests = t1_total + t2_total

          git_sha = os.environ.get('GITHUB_SHA') or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          print("================================================================================")
          print("                    REMOTION TEST ACCOUNTING & AUDIT REPORT                     ")
          print("================================================================================")
          print(f"Target Git SHA:              {git_sha}")
          print(f"Discovered Test Files:       {len(discovered_files)}")
          print(f"Tier 1 Fast Suites:          {len(t1_files)} files | {t1_total} tests ({t1_passed} passed, {t1_failed} failed, {t1_pending} pending)")
          print(f"Tier 2 Heavy Suites:         {len(t2_files)} files | {t2_total} tests ({t2_passed} passed, {t2_failed} failed, {t2_pending} pending)")
          print(f"Total Unique Suites Tested:  {len(union_files)} files (Disjoint partition verified)")
          print(f"Total Unique Tests Executed: {total_tests} tests ({total_passed} passed, {total_failed} failed, {total_pending} pending)")
          print(f"Partition Overlap Count:     {len(overlap)}")
          print(f"Omitted Files Count:         {len(missing_files)}")
          print("================================================================================")

          r12_04_status = None
          r12_04_duration = None
          r12_13_status = None
          r12_13_duration = None
          for suite in t2.get('testResults', []):
              if 's28_r12_render_planner' in suite.get('name', ''):
                  for test in suite.get('assertionResults', []):
                      if 'R12-04' in test.get('title', ''):
                          r12_04_status = test.get('status')
                          r12_04_duration = test.get('duration')
                      elif 'R12-13' in test.get('title', ''):
                          r12_13_status = test.get('status')
                          r12_13_duration = test.get('duration')

          print(f"Special Gate R12-04 (120s max timeout): status={r12_04_status}, duration={r12_04_duration}ms")
          print(f"Special Gate R12-13 (20ms threshold):   status={r12_13_status}, duration={r12_13_duration}ms")

          summary = {
              'gitSha': git_sha,
              'discoveredFilesCount': len(discovered_files),
              'tier1': {
                  'suitesCount': len(t1_files),
                  'totalTests': t1_total,
                  'passedTests': t1_passed,
                  'failedTests': t1_failed,
                  'pendingTests': t1_pending
              },
              'tier2': {
                  'suitesCount': len(t2_files),
                  'totalTests': t2_total,
                  'passedTests': t2_passed,
                  'failedTests': t2_failed,
                  'pendingTests': t2_pending,
                  'specialGates': {
                      'R12-04': {'status': r12_04_status, 'durationMs': r12_04_duration},
                      'R12-13': {'status': r12_13_status, 'durationMs': r12_13_duration}
                  }
              },
              'totalUniqueFiles': len(union_files),
              'totalTests': total_tests,
              'totalPassed': total_passed,
              'totalFailed': total_failed,
              'totalPending': total_pending,
              'overlap': list(overlap),
              'missingFiles': list(missing_files)
          }

          with open('/tmp/vitest_pr_a1_reports/accounting_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(f"""### 🎬 Remotion Test Verification & Accounting Summary
          - **Commit SHA**: `{git_sha}`
          - **Discovered Test Files**: `{len(discovered_files)}`
          - **Tier 1 (Fast Conformance & Contracts)**: `{len(t1_files)}` files | `{t1_passed}/{t1_total}` passed (0 failed, 0 skipped)
          - **Tier 2 (Heavy Integration & Rendering)**: `{len(t2_files)}` files | `{t2_passed}/{t2_total}` passed (0 failed, 0 skipped)
          - **Total Unique Suites**: `{len(union_files)}/49`
          - **Total Unique Tests**: `{total_passed}/{total_tests}`
          - **R12-04 Status**: `{r12_04_status}` ({r12_04_duration}ms)
          - **R12-13 Status**: `{r12_13_status}` ({r12_13_duration}ms)
          - **Accounting Verification**: {'✅ PASSED (100% coverage, 0 overlap, 0 missing)' if len(overlap) == 0 and len(missing_files) == 0 and total_failed == 0 else '❌ FAILED'}
          """)

          assert len(overlap) == 0, f"Error: Tiers overlap: {overlap}"
          assert len(missing_files) == 0, f"Error: Test files omitted: {missing_files}"
          assert len(extra_files) == 0, f"Error: Extra test files executed: {extra_files}"
          assert len(union_files) == len(discovered_files), f"Error: Expected {len(discovered_files)} unique files, got {len(union_files)}"
          assert len(discovered_files) == 49, f"Error: Expected 49 discovered test files, got {len(discovered_files)}"
          assert total_failed == 0, f"Error: {total_failed} tests failed"
          assert total_pending == 0, f"Error: {total_pending} tests pending/skipped"
          assert total_tests == 1545, f"Error: Expected 1545 tests, got {total_tests}"
          assert r12_04_status == 'passed', f"Error: R12-04 failed (status: {r12_04_status})"
          assert r12_13_status == 'passed', f"Error: R12-13 failed (status: {r12_13_status})"

          print("✅ ALL REMOTION GATES, CONFORMANCE AND ACCOUNTING CRITERIA PASSED!")
          EOF

      - name: Upload Remotion Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-test-reports
          path: /tmp/vitest_pr_a1_reports/
          retention-days: 14

