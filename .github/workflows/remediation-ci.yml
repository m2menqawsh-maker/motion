name: Remediation Fortress CI

on:
  push:
    branches: [main, remediation/master-plan]
  pull_request:
    branches: [main]

jobs:
  test-fortress:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        test-category: 
          - architecture
          - contracts
          - golden_scenarios
          - security
          - documentation
          - performance
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pydantic
      
      - name: Run ${{ matrix.test-category }} Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/${{ matrix.test-category }}/ -v \
            --asyncio-mode=auto \
            --junitxml=test-results/${{ matrix.test-category }}.xml \
            --tb=short
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-category }}
          path: test-results/
      
      - name: Block on Failure
        if: failure()
        run: |
          echo "❌ ${{ matrix.test-category }} tests failed - PR cannot be merged"
          exit 1

  coverage-report:
    runs-on: ubuntu-latest
    needs: test-fortress
    if: success()
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pydantic
      
      - name: Generate Coverage Report
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ \
            --cov=api \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=html \
            --asyncio-mode=auto
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
