name: Remediation Fortress CI

on:
  push:
    branches: [main, "remediation/*", "feature/*"]
  pull_request:
    branches: [main, "feature/*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Python Lint
        run: |
          ruff check api/ scripts/core/

  contracts-ts:
    name: contracts-ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Remotion App Dependencies
        working-directory: ./remotion-app
        run: npm ci

      - name: TypeScript Compile & Lint
        working-directory: ./remotion-app
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run Vitest Suite
        run: npm run test

  ground-truth:
    name: ground-truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Ground Truth Sync
        run: |
          python scripts/validators/check_ground_truth_sync.py --check

      - name: Check Dependency Lock
        run: |
          python scripts/validators/check_dependencies_lock.py --check

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Pytest with Coverage Threshold
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          pytest --cov=api --cov=scripts/core --cov-report=xml --cov-report=term --cov-fail-under=48 \
            tests/core tests/gates tests/generators tests/validators tests/architecture tests/contracts tests/fault_injection tests/security tests/api tests/integration/test_pr003_ai_runtime_vertical_slice.py tests/integration/test_pr004_state_consistency.py tests/integration/test_pr005_process_hard_death_recovery.py tests/integration/test_pr005_run_blueprint_provenance.py tests/e2e/test_pipeline_integration.py

      - name: Upload Python Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  strict-e2e:
    name: strict-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci
          npx remotion browser ensure

      - name: Run True E2E Matrix Suite
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          python tests/e2e/true_e2e_suite.py

      - name: Upload E2E Test Artifacts (QC Reports and Logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-e2e-artifacts
          path: |
            projects/**/final_qc_report.json
            projects/**/run.log
            projects/**/05_blueprint.json
          retention-days: 7

  docker-render:
    name: docker-render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermetic Docker Image
        run: |
          BUILD_LOG=$(mktemp)
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Docker build attempt $attempt/$MAX_ATTEMPTS..."
            if docker build -t clean-video-builder -f .agents/docker/Dockerfile.remotion . 2>&1 | tee "$BUILD_LOG"; then
              echo "Docker build succeeded."
              rm -f "$BUILD_LOG"
              break
            fi
            if grep -Ei "toomanyrequests|429 too many requests|rate limit|connection reset|i/o timeout|handshake timeout|temporary failure in name resolution" "$BUILD_LOG" >/dev/null 2>&1; then
              if [ $attempt -eq $MAX_ATTEMPTS ]; then
                echo "Docker build failed after $MAX_ATTEMPTS transient registry/network attempts."
                rm -f "$BUILD_LOG"
                exit 1
              fi
              sleep_sec=$((attempt * 15))
              echo "Transient Docker registry rate limit or network error detected. Waiting ${sleep_sec}s before retry (attempt $attempt/$MAX_ATTEMPTS)..."
              sleep $sleep_sec
            else
              echo "Deterministic Docker build failure detected (not a registry rate limit). Failing immediately without retry."
              rm -f "$BUILD_LOG"
              exit 1
            fi
          done

      - name: Verify Container Execution
        run: |
          docker run --rm clean-video-builder npx remotion versions

      - name: Test Docker Container Subcommand Validation
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          pytest tests/remediation/s02_acceptance/test_acc_007_docker_subcommand_validation.py -v

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Audit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Python Dependency Audit (pip-audit)
        run: |
          pip-audit --desc -r requirements.txt

      - name: Run Node Dependency Audit (Root & App)
        run: |
          npm audit --audit-level=high
          cd remotion-app && npm audit --audit-level=high

      - name: Run Bandit Static Security Scan
        run: |
          bandit -r api/ scripts/core/ -lll

      - name: Run Static Secret Scanner
        run: |
          python scripts/validators/check_secrets.py

      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'

  remotion-verification:
    name: remotion-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci

      - name: Ensure Remotion Browser
        run: |
          npx remotion browser ensure

      - name: Tier 1 — Fast Remotion Verification
        run: |
          mkdir -p /tmp/vitest_pr_a1_reports
          python3 - << 'EOF'
          import glob, os, subprocess, sys
          tier2_names = {
              's28_r09_remotion_adapter.test.ts',
              's28_r10_canvas_adapter.test.ts',
              's28_r11_master_compositor.test.ts',
              's28_r12_render_planner.test.ts',
              's28_r14_production_integration.test.ts',
              's28_r15_destruction_and_load.test.ts',
              's28_r15_part3_final_campaigns.test.ts'
          }
          all_files = sorted(glob.glob('tests/remotion/*.test.ts'))
          t1_files = [f for f in all_files if os.path.basename(f) not in tier2_names]
          print(f"Executing Tier 1 fast verification with {len(t1_files)} files...")
          cmd = [
              'npx', 'vitest', 'run',
              *t1_files,
              '--reporter=default',
              '--reporter=json',
              '--outputFile=/tmp/vitest_pr_a1_reports/tier1_report.json'
          ]
          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          EOF

      - name: Tier 2 — Heavy Remotion Integration Verification
        if: success() || failure()
        run: |
          mkdir -p /tmp/vitest_pr_a1_reports
          python3 - << 'EOF'
          import os, shutil, subprocess, sys

          tier2_files = [
              'tests/remotion/s28_r09_remotion_adapter.test.ts',
              'tests/remotion/s28_r10_canvas_adapter.test.ts',
              'tests/remotion/s28_r11_master_compositor.test.ts',
              'tests/remotion/s28_r12_render_planner.test.ts',
              'tests/remotion/s28_r14_production_integration.test.ts',
              'tests/remotion/s28_r15_destruction_and_load.test.ts',
              'tests/remotion/s28_r15_part3_final_campaigns.test.ts'
          ]

          print(f"Executing Tier 2 heavy integration verification with {len(tier2_files)} files sequentially...")
          cmd = [
              'npx', 'vitest', 'run',
              *tier2_files,
              '--no-file-parallelism',
              '--maxConcurrency=1',
              '--reporter=default',
              '--reporter=json',
              '--outputFile=/tmp/vitest_pr_a1_reports/tier2_report.json'
          ]
          if shutil.which('xvfb-run'):
              cmd = ['xvfb-run', '--auto-servernum'] + cmd

          res = subprocess.run(cmd)
          sys.exit(res.returncode)
          EOF

      - name: Mandatory Remotion Test Accounting & Reconciliation
        if: success() || failure()
        run: |
          python3 scripts/testing/remotion_test_accounting.py \
            --tier1-report /tmp/vitest_pr_a1_reports/tier1_report.json \
            --tier2-report /tmp/vitest_pr_a1_reports/tier2_report.json \
            --output /tmp/vitest_pr_a1_reports/accounting_summary.json \
            --strict

      - name: Upload Remotion Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-test-reports
          path: /tmp/vitest_pr_a1_reports/
          retention-days: 14

  ai-verification:
    name: ai-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci

      - name: Ensure Remotion Browser
        run: |
          npx remotion browser ensure

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio faster-whisper psycopg[binary]

      - name: Tier 1 — Fast AI Platform Verification
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          mkdir -p /tmp/ai_test_reports
          pytest tests/ai/ --ignore=tests/ai/candidates -o junit_family=xunit2 --junitxml=/tmp/ai_test_reports/tier1_junit.xml

      - name: Tier 2 — Heavy Candidates Lifecycle & Rendering Verification
        if: success() || failure()
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          mkdir -p /tmp/ai_test_reports
          xvfb-run --auto-servernum pytest tests/ai/candidates/ -o junit_family=xunit2 --junitxml=/tmp/ai_test_reports/tier2_junit.xml

      - name: Mandatory AI Test Accounting & Reconciliation
        if: success() || failure()
        run: |
          python3 scripts/testing/ai_test_accounting.py \
            --tier1-report /tmp/ai_test_reports/tier1_junit.xml \
            --tier2-report /tmp/ai_test_reports/tier2_junit.xml \
            --output /tmp/ai_test_reports/accounting_summary.json \
            --strict

      - name: Upload AI Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: /tmp/ai_test_reports/
          retention-days: 14


