name: Nightly Real E2E Render Suite

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      render_mode:
        description: 'Rendering mode to exercise (remotion/docker)'
        required: false
        default: 'remotion'

permissions:
  contents: read

concurrency:
  group: nightly-real-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-e2e-mp4-render:
    name: real-e2e-mp4-render
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Probing Tools)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node Dependencies
        run: |
          npm ci
          cd remotion-app && npm ci
          npx remotion browser ensure

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run PR-003 AI-to-Canonical Provenance & Approval Verification
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          pytest tests/integration/test_pr003_provenance_verification.py -v -s

      - name: Run Full Real E2E Pipeline Render (15-Second Multi-Scene)
        env:
          PYTHONPATH: .
          TESTING: '1'
        run: |
          python tests/e2e/true_e2e_suite.py

      - name: Strict MP4 QC Probing & Specification Invariants
        run: |
          python - << 'EOF'
          import json
          import subprocess
          import sys
          from pathlib import Path

          mp4_candidates = list(Path("projects").glob("**/out.mp4"))
          if not mp4_candidates:
              print("FATAL: No output out.mp4 rendered across projects/", file=sys.stderr)
              sys.exit(1)

          mp4_path = mp4_candidates[0]
          print(f"Inspecting rendered output: {mp4_path}")

          # Run ffprobe
          cmd = [
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames",
              "-of", "json", str(mp4_path)
          ]
          res = subprocess.run(cmd, capture_output=True, text=True, check=True)
          probe_data = json.loads(res.stdout)

          # Validate duration >= 14.5s
          duration = float(probe_data.get("format", {}).get("duration", 0))
          print(f"Measured MP4 Duration: {duration:.2f}s")
          if duration < 14.5:
              print(f"FATAL: Output duration ({duration:.2f}s) is shorter than required 15s threshold", file=sys.stderr)
              sys.exit(1)

          # Validate video stream
          video_streams = [s for s in probe_data.get("streams", []) if s.get("codec_type") == "video"]
          if not video_streams:
              print("FATAL: No video stream found in out.mp4", file=sys.stderr)
              sys.exit(1)

          v = video_streams[0]
          width = int(v.get("width", 0))
          height = int(v.get("height", 0))
          print(f"Measured Resolution: {width}x{height}")
          if (width, height) not in [(1920, 1080), (1080, 1920), (1080, 1080), (1080, 1350)]:
              print(f"FATAL: Expected canonical dimensions (1920x1080, 1080x1920, 1080x1080, or 1080x1350), got {width}x{height}", file=sys.stderr)
              sys.exit(1)

          print("PASS: MP4 met all strict quality control criteria.")
          EOF

      - name: Upload Sanitized QC & Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-real-e2e-qc-reports
          path: |
            projects/**/final_qc_report.json
            projects/**/05_blueprint.json
            projects/**/run.log
          retention-days: 7
