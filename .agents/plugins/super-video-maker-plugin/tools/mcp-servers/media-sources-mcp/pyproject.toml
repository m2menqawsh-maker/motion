[project]
name = "media-sources-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2.0.0",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
