<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="calc-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D83A20"/>
    </linearGradient>
    <linearGradient id="calc-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>
    <filter id="glow-calc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D83A20" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Shadow & Body -->
  <rect x="20" y="14" width="88" height="102" rx="18" fill="url(#calc-body)" filter="url(#glow-calc)"/>
  <rect x="22" y="16" width="84" height="98" rx="16" fill="none" stroke="#FFA38F" stroke-width="2" opacity="0.6"/>
  <!-- Screen -->
  <rect x="32" y="26" width="64" height="24" rx="8" fill="url(#calc-screen)"/>
  <text x="88" y="43" fill="#00FFC2" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">42.0</text>
  <!-- Buttons -->
  <rect x="32" y="58" width="16" height="14" rx="4" fill="#FFE2DC"/>
  <rect x="52" y="58" width="16" height="14" rx="4" fill="#FFE2DC"/>
  <rect x="72" y="58" width="24" height="14" rx="4" fill="#2ED8B6"/>
  <rect x="32" y="76" width="16" height="14" rx="4" fill="#FFE2DC"/>
  <rect x="52" y="76" width="16" height="14" rx="4" fill="#FFE2DC"/>
  <rect x="72" y="76" width="24" height="14" rx="4" fill="#FFA500"/>
  <rect x="32" y="94" width="36" height="14" rx="4" fill="#FFFFFF"/>
  <rect x="72" y="94" width="24" height="14" rx="4" fill="#00E5FF"/>
  <!-- Symbols -->
  <text x="84" y="69" fill="#0D2B24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">C</text>
  <text x="84" y="87" fill="#3D2000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">×</text>
  <text x="84" y="105" fill="#003540" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">=</text>
</svg>