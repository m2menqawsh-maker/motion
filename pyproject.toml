[project]
name = "motion"
version = "1.0.0"
description = "Clean Video Workspace — Deterministic Remotion Video Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.103",
    "fal-client==1.0.3",
    "fastapi==0.141.1",
    "ffmpeg-python==0.2.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "jsonschema==4.26.0",
    "librosa==1.0.0",
    "mysql-connector-python==26.7.0",
    "openai==3.19.2",
    "pillow==12.3.0",
    "playwright==1.63.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "replicate==1.0.7",
    "requests==2.34.2",
    "soundfile==0.14.0",
    "uvicorn==0.54.0",
    "websockets==17.1",
]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning:jsonschema.*",
]

[tool.coverage.run]
source = ["api", "scripts/core"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/scratch/*",
]

[tool.coverage.report]
fail_under = 48
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "E722"]
ignore = ["F401"]

